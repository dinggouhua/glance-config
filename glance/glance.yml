            template: |
              <style>
                .pm-viewport { overflow: hidden; width: 100%; }
                .pm-track { display: flex; width: 100%; animation: pm-slide 28s infinite; }
                .pm-viewport:hover .pm-track { animation-play-state: paused; }
                .pm-card { display: flex; flex: 0 0 100%; flex-direction: column; box-sizing: border-box; width: 100%; padding: 0.3rem 0.8rem 0.5rem 0; border-bottom: 1px solid var(--color-separator); text-decoration: none; }
                .pm-title { color: var(--color-text-highlight); font-size: var(--font-size-h4); line-height: 1.45; }
                .pm-main { display: flex; align-items: baseline; justify-content: space-between; gap: 0.8rem; margin-top: 0.45rem; }
                .pm-label { flex: 1 1 auto; overflow: hidden; color: var(--color-subdue); font-size: var(--font-size-h5); text-overflow: ellipsis; white-space: nowrap; }
                .pm-prob { flex: 0 0 auto; color: #3b82f6; font-size: var(--font-size-h1); font-weight: 700; }
                .pm-bar { height: 0.55rem; margin-top: 0.4rem; overflow: hidden; border-radius: 6px; background: var(--color-separator); }
                .pm-bar-fill { height: 100%; background: #3b82f6; border-radius: 6px; }
                .pm-meta { display: flex; flex-wrap: wrap; gap: 0.2rem 1.1rem; margin-top: 0.5rem; color: var(--color-subdue); font-size: var(--font-size-h6); }
                .pm-alts { height: 1.7rem; overflow: hidden; margin-top: 0.35rem; color: var(--color-subdue); font-size: var(--font-size-h6); line-height: 1.6; }
                .pm-up { color: #22c55e; }
                .pm-down { color: #ef4444; }
                @keyframes pm-slide {
                  0% { transform: translateX(0); }
                  2.86% { transform: translateX(-100%); }
                  14.29% { transform: translateX(-100%); }
                  17.14% { transform: translateX(-200%); }
                  28.57% { transform: translateX(-200%); }
                  31.43% { transform: translateX(-300%); }
                  42.86% { transform: translateX(-300%); }
                  45.71% { transform: translateX(-400%); }
                  57.14% { transform: translateX(-400%); }
                  60% { transform: translateX(-500%); }
                  71.43% { transform: translateX(-500%); }
                  74.29% { transform: translateX(-600%); }
                  85.71% { transform: translateX(-600%); }
                  88.57% { transform: translateX(-700%); }
                  100% { transform: translateX(-700%); }
                }
                @media (prefers-reduced-motion: reduce) {
                  .pm-viewport { overflow-x: auto; }
                  .pm-track { animation: none; }
                }
              </style>
              {{ $markets := .JSON.Array "markets" }}
              {{ if eq (len $markets) 0 }}
                <p class="color-subdue">首页盘口暂时无法加载。</p>
              {{ else }}
                <div class="pm-viewport">
                  <div class="pm-track">
                    {{ range $markets }}
                      <a class="pm-card" href="{{ .String "url" }}" target="_blank" rel="noreferrer">
                        <div class="pm-title">{{ .String "title" }}</div>
                        <div class="pm-main"><span class="pm-label">{{ .String "label" }}</span><span class="pm-prob">{{ .Float "prob" | printf "%.0f" }}%</span></div>
                        <div class="pm-bar"><div class="pm-bar-fill" style="width:{{ .Float "prob" }}%;"></div></div>
                        <div class="pm-meta"><span>成交 {{ .String "volume_text" }}</span>{{ if ne (.String "delta_text") "" }}<span class="{{ .String "delta_class" }}">{{ .String "delta_text" }}</span>{{ end }}<span>截止 {{ .String "end_text" }}</span></div>
                        <div class="pm-alts">{{ .String "alts_text" }}</div>
                      </a>
                    {{ end }}
                    {{ range $markets }}
                      <a class="pm-card" href="{{ .String "url" }}" target="_blank" rel="noreferrer">
                        <div class="pm-title">{{ .String "title" }}</div>
                        <div class="pm-main"><span class="pm-label">{{ .String "label" }}</span><span class="pm-prob">{{ .Float "prob" | printf "%.0f" }}%</span></div>
                        <div class="pm-bar"><div class="pm-bar-fill" style="width:{{ .Float "prob" }}%;"></div></div>
                        <div class="pm-meta"><span>成交 {{ .String "volume_text" }}</span>{{ if ne (.String "delta_text") "" }}<span class="{{ .String "delta_class" }}">{{ .String "delta_text" }}</span>{{ end }}<span>截止 {{ .String "end_text" }}</span></div>
                        <div class="pm-alts">{{ .String "alts_text" }}</div>
                      </a>
                    {{ end }}
                  </div>
                </div>
              {{ end }}
          - type: custom-api
            title: 历史上的今天
            cache: 6h
            url: https://zh.wikipedia.org/api/rest_v1/page/summary/Main_Page
            headers:
              Accept: application/json
              Accept-Language: zh-cn
              User-Agent: glance-dashboard/1.0 (+https://github.com/glanceapp/glance)
            template: |
              {{ $month := now | formatTime "01" }}
              {{ $day := now | formatTime "02" }}
              {{ $url := concat "https://zh.wikipedia.org/api/rest_v1/feed/onthisday/selected/" $month "/" $day }}
              {{ $resp := newRequest $url | withHeader "Accept" "application/json" | withHeader "Accept-Language" "zh-cn" | withHeader "User-Agent" "glance-dashboard/1.0 (+https://github.com/glanceapp/glance)" | getResponse }}
              {{ if ne $resp.Response.StatusCode 200 }}
                <p class="color-negative">Wikipedia 数据加载失败（{{ $resp.Response.Status }}）</p>
              {{ else }}
                {{ $events := $resp.JSON.Array "selected" }}
                {{ if eq (len $events) 0 }}
                  <p class="color-subdue">今天没有找到精选条目。</p>
                {{ else }}
                  <ul class="list list-gap-14 collapsible-container" data-collapse-after="5">
                    {{ range $events }}
                      {{ $year := .Int "year" }}
                      {{ $text := .String "text" }}
                      {{ $pages := .Array "pages" }}
                      {{ $link := "" }}
                      {{ if gt (len $pages) 0 }}
                        {{ $firstPage := index $pages 0 }}
                        {{ $link = $firstPage.String "content_urls.desktop.page" }}
                      {{ end }}
                      <li>
                        <div class="flex items-baseline" style="gap: 0.6rem;">
                          <span class="color-primary size-h4" style="flex: 0 0 auto; min-width: 3rem;">{{ $year }}</span>
                          <span class="size-h5" style="flex: 1 1 auto;">
                            {{ if ne $link "" }}
                              <a href="{{ $link }}" target="_blank" rel="noreferrer" class="color-highlight">{{ $text }}</a>
                            {{ else }}
                              {{ $text }}
                            {{ end }}
                          </span>
                        </div>
                      </li>
                    {{ end }}
                  </ul>
                {{ end }}
              {{ end }}
      - size: small
        widgets:
          - type: custom-api
            title: 美股恐慌指数
            cache: 5m
            url: http://127.0.0.1:8897
            template: |
              {{ $value := .JSON.Float "value" }}
              {{ $previous := .JSON.Float "previous" }}
              {{ $change := .JSON.Float "change" }}
              {{ $position := $value }}
              {{ if gt $position 50.0 }}{{ $position = 50.0 }}{{ end }}
              {{ $color := "#22c55e" }}
              {{ $label := "低波动" }}
              {{ $emoji := "😌" }}
              {{ if ge $value 15.0 }}{{ $color = "#eab308" }}{{ $label = "正常" }}{{ $emoji = "🙂" }}{{ end }}
              {{ if ge $value 20.0 }}{{ $color = "#f97316" }}{{ $label = "市场紧张" }}{{ $emoji = "😟" }}{{ end }}
              {{ if ge $value 30.0 }}{{ $color = "#ef4444" }}{{ $label = "高风险" }}{{ $emoji = "😱" }}{{ end }}
              <div style="display:flex; flex-direction:column; gap:0.75em;">
