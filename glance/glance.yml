                  <div style="display:flex; flex-direction:column;">
                    <span style="font-size:1.1em; font-weight:bold; color:{{ $color }};">{{ $emoji }} {{ $label }}</span>
                    <span style="font-size:0.78em; color:var(--color-subdue);">前值 {{ $previous | printf "%.2f" }}
                      {{ if gt $change 0.0 }}<span style="color:#ef4444;">▲ {{ $change | printf "%.2f" }}</span>{{ else if lt $change 0.0 }}<span style="color:#22c55e;">▼ {{ $change | printf "%.2f" }}</span>{{ else }}→ 0.00{{ end }}
