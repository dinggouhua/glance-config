              {{ end }}
          - type: custom-api
            title: AI 中转站余额
            cache: 5m
            url: https://www.dclaw.top/ai-balance/balance
            template: |
              {{ $rem := .JSON.Float "data.remaining" }}
              {{ $used := .JSON.Float "data.used" }}
              {{ $unit := .JSON.String "data.unit" }}
              {{ $today := .JSON.Float "data.today" }}
              <div style="display:flex; flex-direction:column; gap:0.5em;">
                <div style="display:flex; align-items:baseline; gap:0.5em;">
                  <span style="font-size:2.2em; font-weight:bold; line-height:1;">${{ printf "%.2f" $rem }}</span>
                  <span style="font-size:0.85em; color:var(--color-subdue);">{{ $unit }}</span>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.8em; color:var(--color-subdue);">
                  <span>已用 ${{ printf "%.4f" $used }}</span>
                  <span>今日 ${{ printf "%.4f" $today }}</span>
                </div>
              </div>
          - type: custom-api
            title: 江苏省城市足球联赛
            cache: 1h
            url: https://apis.juhe.cn/fapig/football/rank?key=${JUHE_FOOTBALL_KEY}&type=jiangsu
            template: |
              {{ $title := .JSON.String "result.title" }}
              {{ $season := .JSON.String "result.duration" }}
              {{ $rows := .JSON.Array "result.ranking" }}
              <div style="font-size:0.82em;">
                <div style="display:grid; grid-template-columns:24px minmax(0,1.6fr) repeat(6,28px); gap:4px; align-items:center; padding:0.3em 0; border-bottom:1px solid var(--color-separator); color:var(--color-subdue); font-size:0.78em;">
                  <div style="text-align:center;">#</div><div>球队</div><div style="text-align:center;">赛</div><div style="text-align:center;">胜</div><div style="text-align:center;">平</div><div style="text-align:center;">负</div><div style="text-align:center;">净</div><div style="text-align:center;">分</div>
                </div>
                {{ range $rows }}
                  <div style="display:grid; grid-template-columns:24px minmax(0,1.6fr) repeat(6,28px); gap:4px; align-items:center; min-height:2em; padding:0.22em 0; border-bottom:1px solid color-mix(in srgb, var(--color-separator) 55%, transparent);">
                    <div style="text-align:center; font-weight:600;">{{ .String "rank_id" }}</div>
                    <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ .String "team" }}</div>
                    <div style="text-align:center;">{{ .String "matches" }}</div>
                    <div style="text-align:center;">{{ .String "wins" }}</div>
                    <div style="text-align:center;">{{ .String "draw" }}</div>
                    <div style="text-align:center;">{{ .String "losses" }}</div>
                    <div style="text-align:center;">{{ .String "goal_difference" }}</div>
                    <div style="text-align:center; font-weight:700; color:var(--color-primary);">{{ .String "scores" }}</div>
                  </div>
                {{ end }}
              </div>
      - size: full
        widgets:
