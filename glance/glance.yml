                  </div>
                </div>
                <div style="position:relative; height:10px; border-radius:5px; background:linear-gradient(to right, #22c55e 0%, #eab308 30%, #f97316 50%, #ef4444 60%, #991b1b 100%);">
                  <div style="position:absolute; left:calc({{ $position }}% - 6px); top:50%; transform:translateY(-50%); width:13px; height:13px; background:white; border-radius:50%; border:2px solid {{ $color }}; box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>
